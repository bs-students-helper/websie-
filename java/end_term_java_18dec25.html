        Map<String, Integer> myMap = new ConcurrentHashMap<>();

                qnSubText: "What will the output be?",
                options: [

                    "202\\n202\\n202",
                    "101\\n101\\n202"
                ],
                correct: [1],
                solution: `e2 is created via copy constructor as a distinct object (id = 101). e3 points to the exact same reference as e1. Calling e1.setId(202) updates e1 and e3 to 202, while e2 remains 101.`
            }
        ];

        // State Tracking
        let currentMode = 'exam'; // 'exam' or 'learning'
        const userAnswers = {}; // { qnIndex: [selectedOptionIndices] }
        let isSubmitted = false;

        // Initialize App
        document.addEventListener('DOMContentLoaded', () => {
            renderQuestionPalette();
            renderQuestions();
            startTimer();
        });

        // Toggle Sidebar on Mobile
        function toggleMobileSidebar() {
            const sidebar = document.getElementById('portalSidebar');
            const toggleBtn = document.getElementById('mobileSidebarToggle');
            sidebar.classList.toggle('active');
            toggleBtn.classList.toggle('active');
        }

        // Timer Logic
        let secondsElapsed = 1;
        function startTimer() {
            setInterval(() => {
                secondsElapsed++;
                const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
                const secs = String(secondsElapsed % 60).padStart(2, '0');
                document.getElementById('timerDigits').textContent = `${mins}:${secs}`;
            }, 1000);
        }

        // Render Question Palette
        function renderQuestionPalette() {
            const qnGrid = document.getElementById('qnGrid');
            qnGrid.innerHTML = questionsData.map(q => `
                <button class="qn-palette-btn" id="palette_btn_${q.qn}" onclick="scrollToQuestion(${q.qn})">
                    ${q.qn}
                </button>
            `).join('');
        }

        function scrollToQuestion(qnNum) {
            const el = document.getElementById(`question_card_${qnNum}`);
            if (el) {
                el.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
            // Close mobile sidebar if open
            const sidebar = document.getElementById('portalSidebar');
            if (sidebar.classList.contains('active')) {
                toggleMobileSidebar();
            }
        }

        // Set Portal Mode: Exam vs Learning
        function setPortalMode(mode) {
            currentMode = mode;
            document.getElementById('btnExamMode').classList.toggle('active', mode === 'exam');
            document.getElementById('btnLearningMode').classList.toggle('active', mode === 'learning');
            renderQuestions();
        }

        // Render All Questions
        function renderQuestions() {
            const container = document.getElementById('questionsContainer');
            let html = '';

            questionsData.forEach(q => {
                html += `
                <article class="question-card" id="question_card_${q.qn}">
                    <!-- Question Header Bar -->
                    <div class="qn-header-top">
                        <div class="qn-header-main">
                            <h2 class="qn-title">Question ${q.qn}</h2>
                            <button class="btn-solution-pill" onclick="toggleSolution(${q.qn})">
                                <i class="fa-regular fa-circle-check"></i> View Solutions (0)
                            </button>
                        </div>
                        <div class="qn-header-sub">
                            <span class="qn-id-tag">Question ${q.qn} : ${q.id}</span>
                            <span class="qn-meta-info">Total Mark : ${q.marks.toFixed(2)} | Type : ${q.type}</span>
                        </div>
                    </div>

                    <div class="qn-text">${q.text.replace(/\\n/g, '<br>')}</div>

                    ${q.code ? `
                    <div class="code-snippet-wrap">
                        <code>${escapeHtml(q.code)}</code>
                    </div>` : ''}

                    ${q.qnSubText ? `<div class="qn-text" style="margin-top:0.85rem;">${q.qnSubText.replace(/\\n/g, '<br>')}</div>` : ''}

                    <!-- Options / Inputs -->
                    ${renderQuestionInputs(q)}

                    <!-- Footer Action Toolbar -->
                    <div class="qn-footer-toolbar">
                        <div class="qn-actions-group">
                            <button class="btn-action-pill btn-discuss" onclick="alert('Discussion forum loading...')"><i class="fa-regular fa-comments"></i> Discussions (0)</button>
                            <button class="btn-action-pill btn-correct" onclick="alert('Correction reported. Thank you!')"><i class="fa-regular fa-pen-to-square"></i> Suggest Correction</button>
                            <button class="btn-action-pill btn-broken" onclick="alert('Format flag recorded.')"><i class="fa-solid fa-wrench"></i> Broken Format?</button>
                        </div>
                    </div>

                    <!-- Solution Accordion -->
                    <div class="solution-box" id="solution_${q.qn}">
                        <div class="solution-title"><i class="fa-solid fa-circle-info" style="color:var(--accent-purple);"></i> Step-by-Step Solution & Code Trace</div>
                        <div class="solution-text">${q.solution.replace(/\\n/g, '<br>')}</div>
                    </div>
                </article>
                `;

                // Add Advertisement banner after Q6 and Q15
                if (q.qn === 6 || q.qn === 15) {
                    html += `
                    <div class="ad-banner-box">
                        <span class="ad-tag">ADVERTISEMENT</span>
                        <div class="ad-actions">
                            <button class="btn-remove-ads" onclick="alert('Ad-free experience enabled.')"><i class="fa-solid fa-bolt"></i> Remove Ads</button>
                            <button class="btn-close-ad" onclick="this.parentElement.parentElement.remove()"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                    </div>
                    `;
                }
            });

            container.innerHTML = html;
            updatePaletteStatuses();
        }

        function renderQuestionInputs(q) {
            const isMSQ = q.type === 'MSQ';
            const userArr = userAnswers[q.qn] || [];

            return `
            <div class="options-list">
                ${q.options.map((optText, idx) => {
                    const isChecked = userArr.includes(idx);
                    const isCorrect = q.correct.includes(idx);
                    let highlightClass = '';

                    if (isChecked) highlightClass = 'selected';

                    if (currentMode === 'learning' || isSubmitted) {
                        if (isCorrect) highlightClass = 'correct-highlight';
                        else if (isChecked && !isCorrect) highlightClass = 'incorrect-highlight';
                    }

                    const formattedOpt = escapeHtml(optText).replace(/\\n/g, '<br>');

                    return `
                    <label class="option-item ${highlightClass}" onclick="handleOptionSelect(${q.qn}, ${idx}, '${q.type}')">
                        <input type="${isMSQ ? 'checkbox' : 'radio'}" name="qn_${q.qn}" ${isChecked ? 'checked' : ''} style="margin-top:0.2rem;">
                        <span class="option-text">${formattedOpt}</span>
                    </label>
                    `;
                }).join('')}
            </div>
            `;
        }

        function handleOptionSelect(qnNum, optIdx, qnType) {
            if (isSubmitted && currentMode === 'exam') return;

            if (!userAnswers[qnNum]) userAnswers[qnNum] = [];

            if (qnType === 'MCQ') {
                userAnswers[qnNum] = [optIdx];
            } else {
                const pos = userAnswers[qnNum].indexOf(optIdx);
                if (pos > -1) userAnswers[qnNum].splice(pos, 1);
                else userAnswers[qnNum].push(optIdx);
            }

            renderQuestions();
            updatePaletteStatuses();
        }

        function updatePaletteStatuses() {
            let answeredCount = 0;
            questionsData.forEach(q => {
                const btn = document.getElementById(`palette_btn_${q.qn}`);
                const userArr = userAnswers[q.qn] || [];
                if (btn) {
                    if (userArr.length > 0) {
                        btn.classList.add('answered');
                        answeredCount++;
                    } else {
                        btn.classList.remove('answered');
                    }
                }
            });
            document.getElementById('qnAnsweredCount').textContent = `${answeredCount}/${questionsData.length}`;
        }

        function toggleSolution(qnNum) {
            const solBox = document.getElementById(`solution_${qnNum}`);
            if (solBox) {
                solBox.classList.toggle('active');
            }
        }

        function submitExam() {
            isSubmitted = true;
            let totalObtained = 0;
            let maxTotal = 0;

            questionsData.forEach(q => {
                maxTotal += q.marks;
                const userArr = (userAnswers[q.qn] || []).sort().join(',');
                const correctArr = q.correct.sort().join(',');

                if (userArr === correctArr && userArr.length > 0) {
                    totalObtained += q.marks;
                }
            });

            const pct = ((totalObtained / maxTotal) * 100).toFixed(1);
            document.getElementById('scoreVal').textContent = `${totalObtained.toFixed(2)} / ${maxTotal.toFixed(2)}`;
            document.getElementById('scorePct').textContent = `(${pct}%)`;
            document.getElementById('scoreCardBox').classList.add('active');

            // Set to learning mode to show answer highlights
            setPortalMode('learning');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Theme Toggle Button Event
        document.getElementById('themeToggleBtn').addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('bsh-theme', newTheme);
        });
    </script>
